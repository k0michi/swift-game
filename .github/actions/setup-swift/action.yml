name: Setup Swift
description: Install and cache an exact Swift toolchain on macOS, Linux, or Windows

inputs:
  swift-version:
    description: Exact Swift toolchain version
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes binutils gnupg2 libc6-dev libcurl4-openssl-dev \
          libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 \
          libstdc++-13-dev libxml2-dev libz3-dev tzdata zip unzip zlib1g-dev

    - name: Restore Swift installer cache on macOS
      if: runner.os == 'macOS'
      id: cache-macos
      uses: actions/cache/restore@v6
      with:
        path: .swift-downloads/macos
        key: swift-installer-v1-macos-${{ runner.arch }}-${{ inputs.swift-version }}

    - name: Restore Swift archive cache on Linux
      if: runner.os == 'Linux'
      id: cache-linux
      uses: actions/cache/restore@v6
      with:
        path: .swift-downloads/linux
        key: swift-archive-v1-linux-${{ runner.arch }}-${{ inputs.swift-version }}

    - name: Restore Swift installer cache on Windows
      if: runner.os == 'Windows'
      id: cache-windows
      uses: actions/cache/restore@v6
      with:
        path: .swift-downloads/windows
        key: swift-installer-v1-windows-${{ runner.arch }}-${{ inputs.swift-version }}

    - name: Download Swift installer on macOS
      if: runner.os == 'macOS' && steps.cache-macos.outputs.cache-hit != 'true'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        mkdir -p .swift-downloads/macos
        curl --fail --location --output ".swift-downloads/macos/swift-$SWIFT_VERSION.pkg" \
          "https://download.swift.org/swift-$SWIFT_VERSION-release/xcode/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-osx.pkg"

    - name: Download Swift archive on Linux
      if: runner.os == 'Linux' && steps.cache-linux.outputs.cache-hit != 'true'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        case "$(uname -m)" in
          x86_64) platform_directory=ubuntu2404; platform_name=ubuntu24.04 ;;
          aarch64) platform_directory=ubuntu2404-aarch64; platform_name=ubuntu24.04-aarch64 ;;
          *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        archive="swift-$SWIFT_VERSION-RELEASE-$platform_name.tar.gz"
        url="https://download.swift.org/swift-$SWIFT_VERSION-release/$platform_directory/swift-$SWIFT_VERSION-RELEASE/$archive"
        mkdir -p .swift-downloads/linux
        curl --fail --location --output ".swift-downloads/linux/$archive" "$url"
        curl --fail --location --output ".swift-downloads/linux/$archive.sig" "$url.sig"

    - name: Download Swift installer on Windows
      if: runner.os == 'Windows' && steps.cache-windows.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        New-Item -ItemType Directory -Force .swift-downloads/windows | Out-Null
        winget download --id Swift.Toolchain --exact --version $env:SWIFT_VERSION --source winget --download-directory .swift-downloads/windows --accept-package-agreements --accept-source-agreements --disable-interactivity
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to download the Swift $env:SWIFT_VERSION installer"
        }

    - name: Install Swift on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        $installer = Get-ChildItem .swift-downloads/windows -Filter '*.exe' -File -Recurse |
          Where-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            $signature.Status -eq 'Valid' -and $signature.SignerCertificate.Subject -match 'Apple Inc\.'
          } |
          Select-Object -First 1
        if ($null -eq $installer) {
          throw "A valid Apple-signed Swift $env:SWIFT_VERSION installer was not found"
        }
        $process = Start-Process $installer.FullName -ArgumentList '/quiet', '/norestart' -Wait -PassThru
        if ($process.ExitCode -notin 0, 3010) {
          throw "Swift installer failed with exit code $($process.ExitCode)"
        }

    - name: Install Swift on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        package=".swift-downloads/macos/swift-$SWIFT_VERSION.pkg"
        pkgutil --check-signature "$package"
        installer -pkg "$package" -target CurrentUserHomeDirectory

    - name: Install Swift on Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        case "$(uname -m)" in
          x86_64) platform_name=ubuntu24.04 ;;
          aarch64) platform_name=ubuntu24.04-aarch64 ;;
          *) echo "Unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        archive=".swift-downloads/linux/swift-$SWIFT_VERSION-RELEASE-$platform_name.tar.gz"
        curl --fail --location --compressed --silent --show-error https://swift.org/keys/all-keys.asc | gpg --batch --import
        gpg --batch --verify "$archive.sig" "$archive"
        mkdir -p .swift-toolchain
        find .swift-toolchain -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        tar -xzf "$archive" --strip-components=1 -C .swift-toolchain

    - name: Save Swift installer cache on macOS
      if: runner.os == 'macOS' && steps.cache-macos.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .swift-downloads/macos
        key: swift-installer-v1-macos-${{ runner.arch }}-${{ inputs.swift-version }}

    - name: Save Swift archive cache on Linux
      if: runner.os == 'Linux' && steps.cache-linux.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .swift-downloads/linux
        key: swift-archive-v1-linux-${{ runner.arch }}-${{ inputs.swift-version }}

    - name: Save Swift installer cache on Windows
      if: runner.os == 'Windows' && steps.cache-windows.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .swift-downloads/windows
        key: swift-installer-v1-windows-${{ runner.arch }}-${{ inputs.swift-version }}

    - name: Configure Swift on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: echo "$HOME/Library/Developer/Toolchains/swift-$SWIFT_VERSION-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"

    - name: Configure Swift on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.swift-toolchain/usr/bin" >> "$GITHUB_PATH"

    - name: Configure Swift on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        $swiftRoot = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
        $swiftBin = Join-Path $swiftRoot "Toolchains\$env:SWIFT_VERSION+Asserts\usr\bin"
        $sdkRoot = Join-Path $swiftRoot "Platforms\$env:SWIFT_VERSION\Windows.platform\Developer\SDKs\Windows.sdk"
        $swiftCore = Get-ChildItem (Join-Path $swiftRoot 'Runtimes') -Filter swiftCore.dll -File -Recurse |
          Select-Object -First 1
        if (-not (Test-Path $swiftBin)) {
          throw "Swift toolchain was not installed at $swiftBin"
        }
        if (-not (Test-Path $sdkRoot)) {
          throw "Swift Windows SDK was not installed at $sdkRoot"
        }
        if ($null -eq $swiftCore) {
          throw "Swift runtime containing swiftCore.dll was not installed under $swiftRoot\Runtimes"
        }
        $swiftRuntimeBin = $swiftCore.Directory.FullName
        $swiftBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $swiftRuntimeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify Swift version on macOS or Linux
      if: runner.os != 'Windows'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: swift --version | grep "$SWIFT_VERSION"

    - name: Verify Swift version on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        $versionOutput = (& swift --version 2>&1 | Out-String).Trim()
        $swiftExitCode = $LASTEXITCODE
        Write-Host $versionOutput
        if ($swiftExitCode -ne 0) {
          throw "Swift executable failed with exit code $swiftExitCode"
        }
        if (-not $versionOutput.Contains($env:SWIFT_VERSION)) {
          throw "Expected Swift $env:SWIFT_VERSION, but got: $versionOutput"
        }

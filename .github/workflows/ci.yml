name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-swift
        with:
          swift-version: 6.3.3
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.3.3-build-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Build
        run: swift build

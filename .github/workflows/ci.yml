name: CI

env:
  SWIFT_VERSION: 6.3.3
  BUILD_CACHE_VERSION: 2

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-swift
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Compute build cache context
        id: build-cache-context
        shell: bash
        run: echo "sdl-revision=$(git rev-parse HEAD:Dependencies/SDL)" >> "$GITHUB_OUTPUT"

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: build-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-sdl-${{ steps.build-cache-context.outputs.sdl-revision }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'cmake/**', 'scripts/**') }}
          restore-keys: |
            build-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-sdl-${{ steps.build-cache-context.outputs.sdl-revision }}-

      - name: Build on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: .build/debug/swift-game

      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: ./.build/debug/swift-game.exe

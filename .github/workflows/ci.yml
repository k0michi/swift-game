name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: macos-swift-6.3.3
      - name: Install Swift 6.3.3
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --output swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --skip-install --quiet-shell-followup --assume-yes
          ~/.swiftly/bin/swiftly install --use 6.3.3
      - name: Configure Swift
        run: |
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Verify Swift version
        run: swift --version | grep '6.3.3'
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-swift-6.3.3-build-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Build
        run: swift build

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev
      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/swiftly
          key: linux-swift-6.3.3
      - name: Install Swift 6.3.3
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --output swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf swiftly.tar.gz
          ./swiftly init --skip-install --quiet-shell-followup --assume-yes
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use 6.3.3
      - name: Configure Swift
        run: |
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
      - name: Verify Swift version
        run: swift --version | grep '6.3.3'
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: linux-swift-6.3.3-build-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Build
        run: swift build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/Programs/Swift
          key: windows-swift-6.3.3
      - name: Install Swift 6.3.3
        if: steps.swift-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Configure Swift
        shell: pwsh
        run: |
          $swiftRoot = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          $swiftBin = Join-Path $swiftRoot 'Toolchains\6.3.3+Asserts\usr\bin'
          $sdkRoot = Join-Path $swiftRoot 'Platforms\6.3.3\Windows.platform\Developer\SDKs\Windows.sdk'
          $swiftBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path $sdkRoot)) {
            throw "Swift Windows SDK was not installed at $sdkRoot"
          }
          "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Swift version
        shell: pwsh
        run: swift --version | Select-String '6.3.3'
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: windows-swift-6.3.3-build-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Build
        run: swift build

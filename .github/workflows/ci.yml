name: CI

env:
  SWIFT_VERSION: 6.3.3
  BUILD_CACHE_VERSION: 4
  # Caches are saved only by pushes to the default branch, so that every
  # branch restores the latest of them instead of keeping its own.
  SAVES_CACHES: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  # A Swift program that crashes, a test or the compiler, prints its stacks
  # on macOS and Linux, where Swift's backtracer works.
  SWIFT_BACKTRACE: enable=yes,interactive=no,color=no

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # All of the history and tags, for the build to describe itself.
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-swift
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Install build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
          sudo apt-get install --yes libx11-xcb-dev patchelf

      # Only SDL, Dawn and stb, which CMake builds, from what only the CMake
      # files and their build scripts choose. The Swift code builds quickly.
      - name: Restore the dependencies
        id: dependencies-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/dependencies
          key: dependencies-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/build-sdl.*', 'scripts/build-dawn.*', 'scripts/build-stb.*') }}
          restore-keys: |
            dependencies-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-

      - name: Build the games (debug)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh

      - name: Build the games (debug)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Save the dependencies
        if: env.SAVES_CACHES == 'true' && steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/dependencies
          key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}

      - name: Test
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/test.sh

      # Only an optimized build shows what rendering allocates, and only
      # Darwin's allocator lets the tests count it.
      - name: Check that rendering does not allocate
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/test.sh -c release -Xswiftc -enable-testing --filter RenderAllocationTests

      - name: Test with coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/test.sh --enable-code-coverage
          coverage_data="$(find .build -type f -name default.profdata -print -quit)"
          test_bundle="$(find .build -type f -name '*.xctest' -print -quit)"
          test -n "$coverage_data"
          test -n "$test_bundle"
          llvm-cov export --format=lcov --instr-profile "$coverage_data" "$test_bundle" > coverage.lcov

      - name: Upload the coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          disable_search: true
          flags: linux
          fail_ci_if_error: true

      # Swift prints no stacks of a crash on Windows, so Windows keeps a dump
      # of every process that crashes, whose stacks a failed test prints.
      - name: Keep crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-crash-dumps.ps1 keep

      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Print the stacks of crashes
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-crash-dumps.ps1 print

      - name: Upload the crash dumps
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-windows
          path: ${{ runner.temp }}/crash-dumps
          if-no-files-found: ignore

      # After the tests, which use the debug builds, optimized builds of both
      # games to package.
      - name: Build the games (release)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh -c release

      - name: Build the games (release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -c release

      # The release builds of both games. SDL and Dawn are linked statically,
      # so the games need at most the Swift runtime beside them:
      # macOS has its own, Linux gets the toolchain's in lib, found through
      # the executable's run path, and Windows gets it and the Visual C++
      # runtime beside the executable. macOS and Linux are archived with tar,
      # which keeps the executable bit that an artifact's zip would drop.
      - name: Package the games
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="swift-game-$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          package="$RUNNER_TEMP/$name"
          mkdir -p "$package"
          for game in swift-game shooter; do
            cp "$(swift build -c release --show-bin-path)/$game" "$package/"
            if [ "$RUNNER_OS" = Linux ]; then
              mkdir -p "$package/lib"
              ldd "$package/$game" |
                awk -v toolchain="$GITHUB_WORKSPACE/.swift-toolchain/" 'index($3, toolchain) == 1 { print $3 }' |
                xargs -r cp -t "$package/lib"
              patchelf --set-rpath '$ORIGIN/lib' "$package/$game"
            fi
          done
          tar -czf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          echo "SWIFT_GAME_ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          echo "SWIFT_GAME_ARTIFACT=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package the games
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "swift-game-windows"
          New-Item -ItemType Directory -Force $package | Out-Null
          $bin = swift build -c release --show-bin-path
          foreach ($game in "swift-game", "shooter") {
            Copy-Item (Join-Path $bin "$game.exe") $package
          }
          $swiftRuntime = Split-Path -Parent (Get-Command swiftCore.dll).Source
          Copy-Item (Join-Path $swiftRuntime "*.dll") $package
          foreach ($library in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item (Join-Path $env:SystemRoot "System32\$library") $package
          }
          # Dawn loads the shader compiler for Direct3D from beside the
          # executable, and ships the Windows SDK's.
          Copy-Item (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Redist\D3D\x64\d3dcompiler_47.dll") $package
          "SWIFT_GAME_ARTIFACT_NAME=swift-game-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIFT_GAME_ARTIFACT=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload the games
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SWIFT_GAME_ARTIFACT_NAME }}
          path: ${{ env.SWIFT_GAME_ARTIFACT }}

  generated-sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-swift
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Check that the generated VectorMath sources are up to date
        shell: bash
        run: |
          swift scripts/generate-vector-math.swift
          git add --intent-to-add Sources/VectorMath/Generated
          git diff --exit-code -- Sources/VectorMath/Generated

  web:
    name: build (web)
    runs-on: ubuntu-24.04
    env:
      SWIFT_SNAPSHOT: swift-DEVELOPMENT-SNAPSHOT-2026-10-17-a
      SWIFT_EMSCRIPTEN_SDK: swift-DEVELOPMENT-SNAPSHOT-2026-10-17-a_wasm-emscripten
      SWIFT_EMSCRIPTEN_SDK_CHECKSUM: 71c9f690771cb553a68685e6fd8669f390f938801d75de363ccb2da48e568bfe
      # The version the Swift SDK was built with.
      EMSDK_VERSION: 6.0.13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # All of the history and tags, for the build to describe itself.
        with:
          fetch-depth: 0

      # The SDK's modules work only with the compiler of the same snapshot.
      - name: Install the Swift snapshot
        shell: bash
        run: |
          toolchain="$RUNNER_TEMP/swift"
          mkdir -p "$toolchain"
          curl -fsSL "https://download.swift.org/development/ubuntu2404/$SWIFT_SNAPSHOT/$SWIFT_SNAPSHOT-ubuntu24.04.tar.gz" |
            tar xz --strip-components=1 -C "$toolchain"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Install the Swift SDK for Emscripten
        shell: bash
        run: |
          swift sdk install \
            "https://github.com/k0michi/swift-emscripten-sdk/releases/download/$SWIFT_SNAPSHOT/$SWIFT_EMSCRIPTEN_SDK.artifactbundle.tar.gz" \
            --checksum "$SWIFT_EMSCRIPTEN_SDK_CHECKSUM"

      - name: Install Emscripten
        shell: bash
        run: |
          emsdk="$RUNNER_TEMP/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$emsdk"
          "$emsdk/emsdk" install "$EMSDK_VERSION"
          "$emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$emsdk" >> "$GITHUB_ENV"
          echo "$emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Restore the dependencies
        id: dependencies-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/dependencies/emscripten
          key: dependencies-v${{ env.BUILD_CACHE_VERSION }}-web-${{ env.SWIFT_SNAPSHOT }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/emscripten/build-sdl.sh', 'scripts/emscripten/build-dawn.sh', 'scripts/emscripten/build-stb.sh') }}
          restore-keys: |
            dependencies-v${{ env.BUILD_CACHE_VERSION }}-web-${{ env.SWIFT_SNAPSHOT }}-emsdk-${{ env.EMSDK_VERSION }}-

      - name: Build the games (debug)
        shell: bash
        run: |
          ./scripts/emscripten/build.sh debug swift-game
          ./scripts/emscripten/build.sh debug shooter

      - name: Save the dependencies
        if: env.SAVES_CACHES == 'true' && steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/dependencies/emscripten
          key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}

      - name: Install Playwright
        shell: bash
        run: |
          npm ci --prefix Tests/EchoBrowserTests --no-audit --no-fund
          npx --prefix Tests/EchoBrowserTests playwright install --with-deps chromium

      - name: Test
        shell: bash
        run: ./scripts/emscripten/test-browser.sh

      # Pushes to the default branch publish the games on GitHub Pages: the
      # bullet-dodging game at the top, and the shooter at /shooter/.
      - name: Build the games (release)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          site="$RUNNER_TEMP/site"
          release=.build/wasm32-unknown-emscripten/release
          for game in swift-game shooter; do
            ./scripts/emscripten/build.sh release "$game"
            page="$site"
            if [ "$game" != swift-game ]; then page="$site/$game"; fi
            mkdir -p "$page"
            cp "$release/$game.js" "$release/$game.wasm" "$page/"
            cp "$release/$game.html" "$page/index.html"
          done

      - name: Upload the games for Pages
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  pages:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

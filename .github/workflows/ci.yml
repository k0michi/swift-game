name: CI

env:
  SWIFT_VERSION: 6.3.3
  BUILD_CACHE_VERSION: 3

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-swift
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Install build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
          sudo apt-get install --yes libx11-xcb-dev

      - name: Compute build cache context
        id: build-cache-context
        shell: bash
        run: echo "native-source=${{ hashFiles('CMakeLists.txt', 'cmake/Dawn/CMakeLists.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: build-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-native-${{ steps.build-cache-context.outputs.native-source }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'cmake/**', 'Scripts/**') }}
          restore-keys: |
            build-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-native-${{ steps.build-cache-context.outputs.native-source }}-
            build-v${{ env.BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-

      - name: Build on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Test SDL3 wrapper on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/test.sh

      - name: Test with coverage on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/test.sh --enable-code-coverage
          coverage_data="$(find .build -type f -name default.profdata -print -quit)"
          test_bundle="$(find .build -type f -name '*.xctest' -print -quit)"
          test -n "$coverage_data"
          test -n "$test_bundle"
          llvm-cov export --format=lcov --instr-profile "$coverage_data" "$test_bundle" > coverage.lcov

      - name: Upload Linux coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          disable_search: true
          flags: linux
          fail_ci_if_error: true

      - name: Test SDL3 wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1

  web:
    runs-on: ubuntu-24.04
    env:
      SWIFT_SNAPSHOT: swift-DEVELOPMENT-SNAPSHOT-2026-10-17-a
      SWIFT_EMSCRIPTEN_SDK: swift-DEVELOPMENT-SNAPSHOT-2026-10-17-a_wasm-emscripten
      SWIFT_EMSCRIPTEN_SDK_CHECKSUM: 71c9f690771cb553a68685e6fd8669f390f938801d75de363ccb2da48e568bfe
      # The version the Swift SDK was built with.
      EMSDK_VERSION: 6.0.13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SDK's modules work only with the compiler of the same snapshot.
      - name: Install the Swift snapshot
        shell: bash
        run: |
          toolchain="$RUNNER_TEMP/swift"
          mkdir -p "$toolchain"
          curl -fsSL "https://download.swift.org/development/ubuntu2404/$SWIFT_SNAPSHOT/$SWIFT_SNAPSHOT-ubuntu24.04.tar.gz" |
            tar xz --strip-components=1 -C "$toolchain"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Install the Swift SDK for Emscripten
        shell: bash
        run: |
          swift sdk install \
            "https://github.com/k0michi/swift-emscripten-sdk/releases/download/$SWIFT_SNAPSHOT/$SWIFT_EMSCRIPTEN_SDK.artifactbundle.tar.gz" \
            --checksum "$SWIFT_EMSCRIPTEN_SDK_CHECKSUM"

      - name: Install Emscripten
        shell: bash
        run: |
          emsdk="$RUNNER_TEMP/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$emsdk"
          "$emsdk/emsdk" install "$EMSDK_VERSION"
          "$emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$emsdk" >> "$GITHUB_ENV"
          echo "$emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .build/dependencies/emscripten
          key: web-deps-${{ env.SWIFT_SNAPSHOT }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'scripts/emscripten/**') }}

      - name: Build for the browser
        shell: bash
        run: ./scripts/emscripten/build.sh

      - name: Install Playwright
        shell: bash
        run: |
          npm ci --prefix Tests/EchoBrowserTests --no-audit --no-fund
          npx --prefix Tests/EchoBrowserTests playwright install --with-deps chromium

      - name: Test Echo on Web Audio
        shell: bash
        run: ./scripts/emscripten/test-browser.sh

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-swift
        with:
          swift-version: 6.3.3

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.3.3-sdl-${{ hashFiles('Dependencies/SDL/CMakeLists.txt', 'Package.swift', 'cmake/**', 'scripts/**') }}

      - name: Build on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: .build/debug/swift-game

      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: ./.build/debug/swift-game.exe
